# 校验阈值（PRD §4.5 F4 + §4.6 F5）
#
# 与 mapping.yaml 同样的原则：**改阈值不该改代码**。
# 每个阈值都写明"超了会怎样"——因为"丢弃"与"降黄"是两种完全不同的处置。

version: 1

# --------------------------------------------------------------------------- #
# 值域（超出即**丢弃**——说明"这个数不可能是这个指标"）
# --------------------------------------------------------------------------- #
# 注意：值域不是用来"筛掉可疑值"的，而是用来**发现抓错了序列**。
# 例如把"社融存量（万亿）"错当成"社融同比（%）"抓进来，值域会立刻拦下。
value_range:
  # ⚠️ 区间经真实数据修正：PRD 原写 [30, 70]，实测中国非制造业 PMI
  # 在 2020 年 2 月为 **29.6**（疫情期），落在原区间之外。
  # 若按原区间，这条**真实数据会被当成异常丢弃**，进而在序列里造成一个假缺口。
  # 值域是用来"发现抓错了序列"的，不是用来"筛掉看起来不像的值"的——
  # 所以宁可放宽到能被真实历史解释，也不许误杀。
  diffusion_index:   {min: 25,   max: 75,   unit: 点,  desc: 扩散指数（PMI 等）}
  price_index_yoy:   {min: -10,  max: 30,   unit: "%", desc: 价格指数同比（CPI/PPI）}
  stock_yoy:         {min: -10,  max: 50,   unit: "%", desc: 存量同比（社融/M2）}
  yield:             {min: -5,   max: 30,   unit: "%", desc: 收益率}
  percentile:        {min: 0,    max: 100,  unit: "%", desc: 分位}
  pe_ratio:          {min: 0,    max: 200,  unit: 倍, desc: 市盈率}
  # ⚠️ 又一次被真实数据修正：原设 [-30, 30]，实测最大 73.6%、最小 -45.5%
  # （2020 年疫情期的真实同比）。原因很直接：**指数类指标的同比百分比是无界的**——
  # 基数在 50 附近，PMI 从 54.3 掉到 29.6 就是 -45.5%。
  #
  # 所以这里刻意放宽到"只用来抓错序列"的程度：同比百分比超出 [-100, 200]
  # 基本只可能是把别的指标当成了它。值域越宽，它作为"抓错序列探测器"的
  # 误杀率越低，而真正的错序列依然拦得住。
  diffusion_index_yoy: {min: -100, max: 200, unit: "%", desc: 扩散指数的同比变动（指数类同比无上界）}
  net_inflow:        {min: -10000, max: 10000, unit: 亿元, desc: 净流入}

# 哪个指标套哪一条值域。**未声明值域的指标无法通过 F4** ——
# 这是刻意的：新指标上线时必须有人看一眼"这个数的合理范围是多少"。
value_range_of:
  cn.pmi.manufacturing:      diffusion_index
  cn.pmi.non-manufacturing:  diffusion_index
  us.treasury.dgs10:         yield
  us.treasury.dgs2:          yield
  us.treasury.dgs3mo:        yield
  cn.index.pe.000300:        pe_ratio
  # 只用于校验的同比序列也要声明值域。
  # 不做例外：一旦某类观测可以绕过 F4，值域检查就出现了一条无人值守的旁路。
  cn.pmi.manufacturing.yoy:     diffusion_index_yoy
  cn.pmi.non-manufacturing.yoy: diffusion_index_yoy

# 跳变阈值按「**写进内容的量**」选档，而不是按原始指标。
# 例：cn.index.pe.000300 抓的是"市盈率（倍）"，但写进内容的是"历史分位（%）"——
# 两者的合理波动幅度完全不同，用市盈率的 10% 去卡分位是没有意义的。
# 未在这里声明的指标，退回用 value_range_of 的那一档。
jump_of:
  cn.index.pe.000300: percentile
  us.treasury.dgs10: spread

# --------------------------------------------------------------------------- #
# 跳变阈值（超出即**降黄级**，交人看）
# --------------------------------------------------------------------------- #
# 它的定位不是"判断数据真假"，而是"找出值得人多看一眼的地方"。
# 所以超阈值只降级、不丢弃——丢弃会让你永远看不到这个变化。
jump:
  diffusion_index: {max_change: 2.0,  unit: 个百分点, desc: 扩散指数环比变动}
  price_index_yoy: {max_change: 1.0,  unit: 个百分点}
  stock_yoy:       {max_change: 2.0,  unit: 个百分点}
  yield:           {max_change: 50,   unit: bp,       desc: 收益率日度变动}
  pe_ratio:        {max_pct_change: 10, unit: "%",     desc: 市盈率相对变动}
  # 分位是 0-100 的占比，用"改变多少个百分点"衡量。无上界地用相对变动会失真。
  percentile:      {max_change: 20, unit: 个百分点, desc: 分位变动}
  # 利差：50bp 的月度变动已经算大（历史上 2s10s 的月度波动通常远小于此）
  spread:          {max_change: 0.5, unit: 个百分点, desc: 期限利差变动}
  net_inflow:      {max_multiple_of_median: 5,       desc: 相对历史中倍数的倍数}

# --------------------------------------------------------------------------- #
# 交叉校验容差（PRD §4.6 F5）
# --------------------------------------------------------------------------- #
tolerance:
  percent:  0.1    # 百分比类，单位：个百分点
  yield:    2      # 收益率，单位：bp
  amount:   0.5    # 金额类，单位：%
  index:    0.2    # 指数点位，单位：%
  pe:       0.5    # 市盈率 / 分位自算复核，单位：pct

# 哪个指标用哪条容差
tolerance_of:
  cn.pmi.manufacturing:     percent
  cn.pmi.non-manufacturing: percent
  us.treasury.dgs10:        yield
  us.treasury.dgs2:         yield
  us.treasury.dgs3mo:       yield
  cn.index.pe.000300:       pe

# --------------------------------------------------------------------------- #
# 允许的规范化单位（PRD §4.4 F3）
# --------------------------------------------------------------------------- #
# 与 core/contract.py 的 UNIT_TABLE 的值保持一致；此处是"内容侧允许出现哪些单位"的白名单，
# 比 UNIT_TABLE 更严（例如"日期""比值"可以存在于契约里，但不该出现在数据槽里）。
allowed_units: ["%", "点", "倍", "亿元", "bp"]

# --------------------------------------------------------------------------- #
# 期间格式
# --------------------------------------------------------------------------- #
period_patterns:
  month: '^\d{4}-\d{2}$'
  quarter: '^\d{4}-Q[1-4]$'
  day: '^\d{4}-\d{2}-\d{2}$'

# --------------------------------------------------------------------------- #
# 发布惯例（用于「内容截至」日期）
# --------------------------------------------------------------------------- #
# PRD §4.4 F3 要求每条观测都必须带「发布日」。但有的源并不提供它——
# 东方财富只给统计期间（REPORT_DATE），适配器刻意**不推算**（宁缺勿造）。
#
# 于是把"这个指标的发布日按什么惯例确定"显式声明在这里。
# 关键是：这是一条**公开、可核对、可修改的事实**，不是工具在猜。
#   period_end = 该期间的最后一天（中国 PMI 由统计局在参考月最后一天发布）
# 未声明惯例、且源也没给发布日的指标 → F3 直接丢弃（不放宽）。
publication_convention:
  cn.pmi.manufacturing: period_end
  cn.pmi.non-manufacturing: period_end
  # 只用于校验的同比序列走同一惯例（它就是同一次发布的另一个口径）。
  # 漏掉它们会让 F3 直接丢弃同比观测，于是 C2 永远"无法执行"→ 全部降黄。
  cn.pmi.manufacturing.yoy: period_end
  cn.pmi.non-manufacturing.yoy: period_end
